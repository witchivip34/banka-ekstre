[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "banka-ekstre"
version = "0.1.0"
description = "Türk bankalarının internet şubesi ekstre dosyalarını (.xls/.xlsx) tek bir ortak işlem listesine çevirir; CSV, XLSX ve muhasebe içe aktarım profilleri üretir."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ahmet Said Kara" }]
keywords = ["banka", "ekstre", "muhasebe", "xls", "xlsx", "csv", "turkey", "bank statement"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Natural Language :: Turkish",
    "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = ["xlrd>=2.0", "xlwt>=1.3", "openpyxl>=3.0"]

[project.optional-dependencies]
excel = ["pywin32; sys_platform == 'win32'"]
test = ["pytest>=7"]

[project.scripts]
banka-ekstre = "banka_ekstre.cli:main"

[tool.setuptools.packages.find]
include = ["banka_ekstre*"]

[tool.setuptools.package-data]
banka_ekstre = ["profiller/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
